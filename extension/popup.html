<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>IG Relationship Auditor Bridge</title>
    <style>
      body {
        width: 310px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        font-size: 12px;
        line-height: 1.45;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .ok { background: rgba(16, 185, 129, 0.2); color: #34d399; }
      .warn { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
      .actions { display: flex; gap: 8px; }
      button {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary { background: #06b6d4; color: #082f49; }
      .danger { background: #ef4444; color: #fff; }
      .muted { color: #94a3b8; font-size: 11px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>
      <span>IG Auditor Bridge</span>
      <span id="status-pill" class="pill warn">Checking...</span>
    </h1>
    <div id="session-card" class="card">Checking Instagram session...</div>
    <div id="job-card" class="card">Job status: Idle</div>
    <div class="actions">
      <button id="open-dashboard" class="primary">Open Dashboard</button>
      <button id="abort-job" class="danger">Stop Job</button>
    </div>
    <div class="muted">
      Works with your GitHub Pages dashboard (<code>a-vip.github.io/ig-relationship-auditor</code>) and <code>localhost</code>. Never shares your session cookie.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
